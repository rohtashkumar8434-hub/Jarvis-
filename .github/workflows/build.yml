name: Build JarvisPC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unpack Project Zip and Fix Gradle Config
      run: |
        unzip -o *.zip
        if [ -d "JarvisPC" ]; then
          cp -r JarvisPC/* .
        fi
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#090D16"/>
            <stroke android:width="4dp" android:color="#00E5FF"/>
            <size android:width="108dp" android:height="108dp"/>
        </shape>
        EOF
        sed -i 's/@mipmap\/ic_launcher_round/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml
        sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml

    - name: Setup Gradle 8.5 and Build APK
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Assemble Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: JarvisPC-APK
        path: app/build/outputs/apk/debug/*.apk
        
